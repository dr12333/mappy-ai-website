<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | Mappy AI</title>
    <meta
      name="description"
      content="Redirecting you straight to Mappy AI signup."
    />
    <meta http-equiv="refresh" content="0; url=https://app.mappy-ai.com/login.html?mode=signup&amp;ref=start_redirect" />
    <link rel="canonical" href="https://app.mappy-ai.com/login.html?mode=signup&amp;ref=start_redirect" />
    <link rel="icon" type="image/svg+xml" href="../assets/mindmap_builder.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon_48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon_16x16.png" />
    <link rel="manifest" href="../site.webmanifest" />
    <script defer src="https://metrics.mappy-ai.com/script.js" data-website-id="82477cf9-ac03-4d35-9e62-6d16cd0c3d6b"></script>
    <script>
      const currentUrl = new URL(window.location.href);
      const targetUrl = new URL("https://app.mappy-ai.com/login.html");
      const ref = currentUrl.searchParams.get("ref") || "start_redirect";
      const plan = currentUrl.searchParams.get("plan");

      targetUrl.searchParams.set("mode", "signup");
      targetUrl.searchParams.set("ref", ref);

      if (plan) {
        targetUrl.searchParams.set("plan", plan);
      }

      window.location.replace(targetUrl.toString());
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Space Grotesk", sans-serif;
        background: #f5f4f1;
        color: #2f3337;
      }

      main {
        max-width: 32rem;
        text-align: center;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Redirecting to signup.</p>
      <p>
        If nothing happens,
        <a href="https://app.mappy-ai.com/login.html?mode=signup&amp;ref=start_redirect">continue to Mappy AI</a>.
      </p>
    </main>
  </body>
</html>
